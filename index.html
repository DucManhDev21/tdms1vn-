  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --accent: #06b6d4;
      --dark: #0f172a;
      --darker: #020617;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body { background: var(--dark); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh; }
    
    /* Sidebar */
    #sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100vh; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); z-index: 1000; transition: left 0.3s cubic-bezier(.4,0,.2,1); overflow-y: auto; border-right: 1px solid var(--border); }
    #sidebar.open { left: 0; }
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; backdrop-filter: blur(2px); }
    #overlay.show { display: block; }
    
    /* Hamburger */
    #hamburger { position: fixed; top: 14px; left: 16px; z-index: 1001; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: all 0.2s; }
    #hamburger:hover { background: var(--primary); border-color: var(--primary-light); }
    #hamburger span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s; }
    
    /* Top bar */
    #topbar { position: fixed; top: 0; left: 0; right: 0; height: 58px; background: rgba(15,23,42,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 100; display: flex; align-items: center; justify-content: flex-end; padding: 0 20px; gap: 12px; }
    
    /* Main content */
    #main { margin-top: 58px; padding: 24px 20px; max-width: 900px; margin-left: auto; margin-right: auto; }
    
    /* Nav items */
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 10px; cursor: pointer; transition: all 0.2s; color: var(--muted); font-size: 15px; }
    .nav-item:hover { background: rgba(59,130,246,0.15); color: var(--text); }
    .nav-item.active { background: linear-gradient(135deg, rgba(30,64,175,0.5), rgba(6,182,212,0.2)); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .nav-item i { width: 20px; text-align: center; }
    
    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .card-sm { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    
    /* Balance display */
    .balance-display { background: linear-gradient(135deg, #1e3a8a, #1e40af, #0369a1); border-radius: 16px; padding: 20px 24px; }
    
    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    
    /* Form elements */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 14px; transition: border-color 0.2s; outline: none; }
    .form-control:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    select.form-control { cursor: pointer; }
    textarea.form-control { resize: vertical; min-height: 80px; }
    
    /* Buttons */
    .btn-primary { background: linear-gradient(135deg, #1e40af, #0369a1); color: white; border: none; border-radius: 10px; padding: 13px 24px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; letter-spacing: 0.5px; transition: all 0.2s; }
    .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #2563eb, #0284c7); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    
    /* Badge */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge-hot { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-best { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .badge-new { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    
    /* Status badges */
    .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .status-processing { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .status-completed { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .status-cancelled { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    
    /* Info box dashed */
    .info-box { border: 1.5px dashed var(--border); border-radius: 12px; padding: 16px; background: rgba(15,23,42,0.5); }
    
    /* Popup */
    #popup-modal { display: none; position: fixed; inset: 0; z-index: 2000; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    #popup-modal.show { display: flex; }
    .popup-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; max-width: 440px; width: 90%; animation: fadeInScale 0.3s ease; }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    
    /* Auth modal */
    #auth-modal { display: flex; position: fixed; inset: 0; z-index: 3000; align-items: center; justify-content: center; background: rgba(2,6,23,0.95); }
    .auth-content { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 40px; max-width: 420px; width: 90%; }
    
    /* Table */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th { background: #0f172a; color: var(--muted); font-weight: 600; padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .data-table td { padding: 12px; border-bottom: 1px solid rgba(51,65,85,0.5); color: var(--text); }
    .data-table tr:hover td { background: rgba(30,41,59,0.5); }
    
    /* Radio */
    .radio-group { display: flex; gap: 12px; }
    .radio-option { flex: 1; cursor: pointer; }
    .radio-option input { display: none; }
    .radio-label { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 14px; color: var(--muted); }
    .radio-option input:checked + .radio-label { border-color: var(--primary-light); background: rgba(59,130,246,0.1); color: #60a5fa; }
    .radio-label i { font-size: 12px; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    /* Responsive */
    @media (max-width: 640px) { #main { padding: 16px 12px; } .card { padding: 16px; } }

    /* Toast notification */
    #toast { position: fixed; bottom: 24px; right: 24px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; }
    .toast-item { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease; min-width: 260px; max-width: 360px; }
    .toast-success { background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.4); color: #4ade80; }
    .toast-error { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); color: #f87171; }
    .toast-info { background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.4); color: #60a5fa; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Platform icons */
    .platform-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    
    /* Stats grid */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    
    /* Page transition */
    .page { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Gradient text */
    .gradient-text { background: linear-gradient(135deg, #60a5fa, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  </style>
</head>

    <!-- Tab switcher -->
    <div style="display:flex; border:1px solid var(--border); border-radius:10px; margin-bottom:20px; overflow:hidden;">
      <button id="tab-login" onclick="switchTab('login')" style="flex:1; padding:10px; font-size:14px; font-weight:600; background:var(--primary); color:white; border:none; cursor:pointer; transition:all 0.2s;">Đăng nhập</button>
      <button id="tab-register" onclick="switchTab('register')" style="flex:1; padding:10px; font-size:14px; font-weight:600; background:transparent; color:var(--muted); border:none; cursor:pointer; transition:all 0.2s;">Đăng ký</button>
    </div>
    <!-- Login form -->
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="login-email" type="email" class="form-control" placeholder="email@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input id="login-password" type="password" class="form-control" placeholder="••••••••"/>
      </div>
      <button id="btn-login" class="btn-primary" onclick="doLogin()" style="margin-bottom:12px;">
        <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Đăng nhập
      </button>
      <button onclick="doGoogleLogin()" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'">
        <i class="fab fa-google" style="color:#ea4335;"></i> Tiếp tục với Google
      </button>
    </div>
    <!-- Register form -->
    <div id="register-form" style="display:none;">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="reg-email" type="email" class="form-control" placeholder="email@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input id="reg-password" type="password" class="form-control" placeholder="Tối thiểu 6 ký tự"/>
      </div>
      <div class="form-group">
        <label class="form-label">Xác nhận mật khẩu</label>
        <input id="reg-confirm" type="password" class="form-control" placeholder="Nhập lại mật khẩu"/>
      </div>
      <button id="btn-register" class="btn-primary" onclick="doRegister()">
        <i class="fas fa-user-plus" style="margin-right:8px;"></i>Tạo tài khoản
      </button>
    </div>
  </div>

function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
  document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
  document.getElementById('tab-login').style.background = isLogin ? 'var(--primary)' : 'transparent';
  document.getElementById('tab-login').style.color = isLogin ? 'white' : 'var(--muted)';
  document.getElementById('tab-register').style.background = isLogin ? 'transparent' : 'var(--primary)';
  document.getElementById('tab-register').style.color = isLogin ? 'var(--muted)' : 'white';
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  if (!email || !pw) { showToast('Vui lòng điền đầy đủ thông tin', 'error'); return; }
  if (!email.includes('@')) { showToast('Email không hợp lệ', 'error'); return; }
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Đang đăng nhập...';
  setTimeout(() => {
    // Mock login success
    currentUser = { email: email, uid: 'user_' + btoa(email).slice(0,8) };
    if (!cachedBalance) userBalance = 250000 + Math.floor(Math.random() * 500000);
    localStorage.setItem('tdms_user', JSON.stringify(currentUser));
    localStorage.setItem('tdms_balance', userBalance);
    document.getElementById('auth-modal').style.display = 'none';
    initApp();
    showToast('Đăng nhập thành công!', 'success');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Đăng nhập';
  }, 1000);
}

function doRegister() {
  const email = document.getElementById('reg-email').value.trim();
  const pw = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;
  if (!email || !pw || !confirm) { showToast('Vui lòng điền đầy đủ thông tin', 'error'); return; }
  if (pw !== confirm) { showToast('Mật khẩu xác nhận không khớp', 'error'); return; }
  if (pw.length < 6) { showToast('Mật khẩu phải có ít nhất 6 ký tự', 'error'); return; }
  const btn = document.getElementById('btn-register');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Đang tạo tài khoản...';
  setTimeout(() => {
    currentUser = { email: email, uid: 'user_' + btoa(email).slice(0,8) };
    userBalance = 0;
    localStorage.setItem('tdms_user', JSON.stringify(currentUser));
    localStorage.setItem('tdms_balance', '0');
    document.getElementById('auth-modal').style.display = 'none';
    initApp();
    showToast('Tạo tài khoản thành công! Chào mừng đến TDMS1VN', 'success');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus" style="margin-right:8px;"></i>Tạo tài khoản';
  }, 1000);
}

}

// ============================================================
// NAVIGATION
// ============================================================
function navigate(page) {
  // Update active nav
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  
  // Close sidebar on mobile
  if (window.innerWidth < 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }
  
  // Render page
  const pages = {
    home: renderHome, account: renderAccount, deposit: renderDeposit,
    order: renderOrder, orders: renderOrders, history: renderHistory, contact: renderContact
  };
  const render = pages[page];
  if (render) {
    document.getElementById('page-content').innerHTML = '<div class="page">' + render() + '</div>';
    bindPageEvents(page);
  }
}

function renderOrders() {
  const statusMap = {
    'Pending': {label:'🟡 Đang xử lý', cls:'status-pending'},
    'Processing': {label:'🔵 Đang vận hành', cls:'status-processing'},
    'Completed': {label:'🟢 Hoàn thành', cls:'status-completed'},
    'Cancelled': {label:'🔴 Đã hủy', cls:'status-cancelled'}
  };
  const perPage = 10;
  let currentPage = 1;
  let filterStatus = 'all';
  
  const filteredOrders = () => filterStatus === 'all' ? orders : orders.filter(o => o.status === filterStatus);
  
  const renderTable = () => {
    const fo = filteredOrders();
    const start = (currentPage - 1) * perPage;
    const pageOrders = fo.slice(start, start + perPage);
    if (fo.length === 0) return `<div style="text-align:center; padding:40px; color:var(--muted);"><i class="fas fa-inbox" style="font-size:40px; margin-bottom:12px; display:block;"></i>Chưa có đơn hàng nào</div>`;
    return `
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr>
            <th>Mã đơn</th><th>Dịch vụ</th><th>Số lượng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Ngày đặt</th>
          </tr></thead>
          <tbody>
            ${pageOrders.map(o => `<tr>
              <td style="font-family:monospace; color:#60a5fa; font-size:12px;">#${o.orderId}</td>
              <td style="font-size:12px; max-width:200px;"><div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${o.serviceName}</div><div style="color:var(--muted); font-size:11px;">${o.platform}</div></td>
              <td style="font-weight:600;">${o.quantity?.toLocaleString('vi-VN')}</td>
              <td style="font-weight:700; color:#4ade80;">${formatVND(o.totalPrice)}</td>
              <td><span class="badge ${(statusMap[o.status]||{cls:'status-pending'}).cls}">${(statusMap[o.status]||{label:'🟡 Pending'}).label}</span></td>
              <td style="font-size:12px; color:var(--muted);">${new Date(o.createdAt).toLocaleDateString('vi-VN')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:16px; flex-wrap:wrap; gap:8px;">
        <div style="font-size:13px; color:var(--muted);">Hiển thị ${Math.min(start+perPage,fo.length)}/${fo.length} đơn hàng</div>
        <div style="display:flex; gap:6px;">
          ${Array.from({length:Math.ceil(fo.length/perPage)}, (_,i) => `
            <button onclick="changePage(${i+1})" style="width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:${currentPage===i+1?'var(--primary)':'transparent'}; color:${currentPage===i+1?'white':'var(--muted)'}; cursor:pointer; font-size:13px;">${i+1}</button>
          `).join('')}
        </div>
      </div>`;
  };
  
  window.changePage = (p) => { currentPage = p; document.getElementById('orders-table').innerHTML = renderTable(); };
  window.changeFilter = (s) => { filterStatus = s; currentPage = 1; document.getElementById('orders-table').innerHTML = renderTable(); document.querySelectorAll('.filter-btn').forEach(b => { b.style.background = b.dataset.filter === s ? 'var(--primary)' : 'transparent'; b.style.color = b.dataset.filter === s ? 'white' : 'var(--muted)'; }); };
  
  return `
  <div>
    <h2 style="font-size:20px; font-weight:800; margin:0 0 20px;">
      <i class="fas fa-box" style="color:#8b5cf6; margin-right:10px;"></i>Đơn hàng đã đặt
    </h2>
    <div class="card">
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;">
        ${[{k:'all',l:'Tất cả'},{k:'Pending',l:'🟡 Chờ xử lý'},{k:'Processing',l:'🔵 Đang chạy'},{k:'Completed',l:'🟢 Hoàn thành'},{k:'Cancelled',l:'🔴 Đã hủy'}].map(f => `
          <button class="filter-btn" data-filter="${f.k}" onclick="changeFilter('${f.k}')" style="padding:6px 14px; border-radius:8px; border:1px solid var(--border); background:${f.k==='all'?'var(--primary)':'transparent'}; color:${f.k==='all'?'white':'var(--muted)'}; cursor:pointer; font-size:13px; font-weight:600;">${f.l}</button>
        `).join('')}
      </div>
      <div id="orders-table">${renderTable()}</div>
    </div>
  </div>`;
}

function bindPageEvents(page) {
  if (page === 'order') {
    window.updateCategories = () => {
      const plat = document.getElementById('select-platform').value;
      const cats = [...new Set(SERVICES.filter(s => !plat || s.platform === plat).map(s => s.category))];
      const sel = document.getElementById('select-category');
      sel.innerHTML = '<option value="">-- Chọn phân loại --</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('select-service').innerHTML = '<option value="">-- Chọn gói dịch vụ --</option>';
      document.getElementById('service-info-card').style.display = 'none';
    };
    window.updateServiceList = () => {
      const plat = document.getElementById('select-platform').value;
      const cat = document.getElementById('select-category').value;
      const svcs = SERVICES.filter(s => (!plat || s.platform === plat) && (!cat || s.category === cat));
      const badgeMap = {best:'[Bán chạy nhất] ', hot:'[Hot] ', new:'[Mới] ', '':''};
      document.getElementById('select-service').innerHTML = '<option value="">-- Chọn gói dịch vụ --</option>' + svcs.map(s => `<option value="${s.id}">${badgeMap[s.badge]||''}${s.id} - ${s.name} (${s.rate.toLocaleString('vi-VN')}đ/1000)</option>`).join('');
      document.getElementById('service-info-card').style.display = 'none';
    };
    window.filterServices = () => {
      const q = document.getElementById('search-service').value.toLowerCase();
      if (!q) return;
      const found = SERVICES.filter(s => s.name.toLowerCase().includes(q) || s.id.includes(q));
      if (found.length > 0) {
        const svc = found[0];
        document.getElementById('select-platform').value = svc.platform;
        updateCategories();
        document.getElementById('select-category').value = svc.category;
        updateServiceList();
        document.getElementById('select-service').value = svc.id;
        onServiceSelect();
      }
    };
    window.onServiceSelect = () => {
      const id = document.getElementById('select-service').value;
      const svc = SERVICES.find(s => s.id === id);
      const card = document.getElementById('service-info-card');
      if (!svc) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      const badgeMap = {best:'<span class="badge badge-best">🏆 Bán chạy nhất</span>', hot:'<span class="badge badge-hot">🔥 Hot</span>', new:'<span class="badge badge-new">✨ Mới</span>', '':''};
      document.getElementById('service-info-header').innerHTML = `[${svc.id}] ${svc.name} ${badgeMap[svc.badge]||''}`;
      document.getElementById('svc-rate').textContent = svc.rate.toLocaleString('vi-VN') + ' VND';
      document.getElementById('svc-min').textContent = svc.min.toLocaleString('vi-VN');
      document.getElementById('svc-max').textContent = svc.max.toLocaleString('vi-VN');
      document.getElementById('svc-link-format').textContent = svc.exampleLink;
      document.getElementById('qty-hint').innerHTML = `<i class="fas fa-info-circle" style="margin-right:4px;"></i>Tối thiểu: <strong>${svc.min.toLocaleString('vi-VN')}</strong> – Tối đa: <strong>${svc.max.toLocaleString('vi-VN')}</strong>`;
      document.getElementById('order-quantity').min = svc.min;
      document.getElementById('order-quantity').max = svc.max;
      calcPrice();
    };
    window.calcPrice = () => {
      const id = document.getElementById('select-service').value;
      const svc = SERVICES.find(s => s.id === id);
      const qty = parseInt(document.getElementById('order-quantity').value) || 0;
      if (svc && qty > 0) {
        const price = Math.ceil(qty * svc.rate / 1000);
        document.getElementById('price-badge').textContent = formatVND(price);
      } else {
        document.getElementById('price-badge').textContent = '0 VND';
      }
    };
    window.toggleMode = () => {
      const multi = document.getElementById('mode-multi').checked;
      document.getElementById('order-link-single').style.display = multi ? 'none' : 'block';
      document.getElementById('order-link-multi').style.display = multi ? 'block' : 'none';
    };
    window.submitOrder = () => {
      const now = Date.now();
      const btn = document.getElementById('btn-submit-order');
      if (now - lastOrderTime < RATE_LIMIT_MS) {
        showToast('Vui lòng chờ ' + Math.ceil((RATE_LIMIT_MS - (now - lastOrderTime)) / 1000) + 's trước khi đặt lại', 'error'); return;
      }
      const id = document.getElementById('select-service').value;
      const svc = SERVICES.find(s => s.id === id);
      const link = document.getElementById('mode-multi').checked ? document.getElementById('order-link-multi').value.trim() : document.getElementById('order-link-single').value.trim();
      const qty = parseInt(document.getElementById('order-quantity').value);
      if (!svc) { showToast('Vui lòng chọn dịch vụ', 'error'); return; }
      if (!link) { showToast('Vui lòng nhập liên kết', 'error'); return; }
      if (!qty || qty < svc.min) { showToast(`Số lượng tối thiểu là ${svc.min.toLocaleString('vi-VN')}`, 'error'); return; }
      if (qty > svc.max) { showToast(`Số lượng tối đa là ${svc.max.toLocaleString('vi-VN')}`, 'error'); return; }
      const totalPrice = Math.ceil(qty * svc.rate / 1000);
      if (totalPrice > userBalance) { showToast('Số dư không đủ. Vui lòng nạp thêm tiền!', 'error'); return; }
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Đang xử lý...';
      lastOrderTime = Date.now();
      setTimeout(() => {
        userBalance -= totalPrice;
        localStorage.setItem('tdms_balance', userBalance);
        const order = {
          orderId: Date.now().toString(36).toUpperCase(),
          uid: currentUser.uid,
          serviceId: svc.id,
          serviceName: svc.name,
          platform: svc.platform,
          link: link,
          quantity: qty,
          totalPrice: totalPrice,
          status: 'Pending',
          createdAt: new Date().toISOString()
        };
        orders.unshift(order);
        localStorage.setItem('tdms_orders', JSON.stringify(orders));
        balanceHistory.push({type:'debit', amount:totalPrice, desc:`Đặt dịch vụ #${order.orderId}`, balanceAfter:userBalance, time:new Date().toISOString()});
        localStorage.setItem('tdms_balance_history', JSON.stringify(balanceHistory));
        updateBalanceDisplay();
        showToast('Đặt hàng thành công! Mã đơn: #' + order.orderId, 'success');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-shopping-cart" style="margin-right:8px;"></i>ĐẶT HÀNG';
        setTimeout(() => {
          document.getElementById('order-link-single').value = '';
          document.getElementById('order-quantity').value = '';
          document.getElementById('price-badge').textContent = '0 VND';
        }, 500);
      }, 1200);
    };
  }
}

// ============================================================
// UTILITIES
// ============================================================
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Đã sao chép: ' + text, 'success'));
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast');
  const item = document.createElement('div');
  item.className = `toast-item toast-${type}`;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  item.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i><span>${msg}</span>`;
  container.appendChild(item);
  setTimeout(() => { item.style.opacity = '0'; item.style.transform = 'translateX(100%)'; item.style.transition = 'all 0.3s'; setTimeout(() => item.remove(), 300); }, 3000);
}

function toggleFaq(i) {
  const body = document.getElementById('faq-body-' + i);
  const icon = document.getElementById('faq-icon-' + i);
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  icon.style.transform = isOpen ? '' : 'rotate(180deg)';
}

// ============================================================
// POPUP
// ============================================================
const POPUP_DATA = {
  id: 'popup_001',
  title: '🎉 Chào mừng đến TDMS1VN!',
  message: 'Hệ thống quản lý dịch vụ số uy tín hàng đầu Việt Nam. Nạp tiền ngay hôm nay để nhận ưu đãi đặc biệt 5% cho lần nạp đầu tiên!'
};

function closePopup(suppress) {
  document.getElementById('popup-modal').classList.remove('show');
  if (suppress) {
    localStorage.setItem('popup_hide_until_' + POPUP_DATA.id, Date.now() + 3 * 3600 * 1000);
  }
}

function showPopupIfNeeded() {
  const hideUntil = localStorage.getItem('popup_hide_until_' + POPUP_DATA.id);
  if (hideUntil && Date.now() < parseInt(hideUntil)) return;
  document.getElementById('popup-title').textContent = POPUP_DATA.title;
  document.getElementById('popup-message').textContent = POPUP_DATA.message;
  setTimeout(() => document.getElementById('popup-modal').classList.add('show'), 1500);
}

// ============================================================
// DEPOSIT SUBMIT
// ============================================================
function submitDeposit() {
  const now = Date.now();
  const btn = document.getElementById('btn-deposit');
  if (now - lastOrderTime < RATE_LIMIT_MS) {
    showToast('Vui lòng chờ trước khi gửi yêu cầu mới', 'error'); return;
  }
  const amount = parseInt(document.getElementById('deposit-amount').value);
  if (!amount || amount < 10000) { showToast('Số tiền nạp tối thiểu là 10,000 VND', 'error'); return; }
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Đang gửi yêu cầu...';
  lastOrderTime = Date.now();
  setTimeout(() => {
    showToast('Yêu cầu nạp tiền đã được gửi! Admin sẽ xác nhận trong vài phút.', 'success');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right:8px;"></i>GỬI YÊU CẦU NẠP TIỀN';
  }, 1000);
}

// ============================================================
// INIT
// ============================================================
function initApp() {
  updateBalanceDisplay();
  navigate('home');
  showPopupIfNeeded();
  // Simulate balance update after load
  setTimeout(() => { updateBalanceDisplay(); }, 800);
}

// Check auth on load
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('tdms_user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      const bal = localStorage.getItem('tdms_balance');
      if (bal !== null) userBalance = parseFloat(bal);
      document.getElementById('auth-modal').style.display = 'none';
      initApp();
    } catch(e) {
      localStorage.removeItem('tdms_user');
    }
  }
});
</script>
