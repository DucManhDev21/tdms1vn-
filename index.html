    document.documentElement.classList.toggle('dark', state.theme === 'dark');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('vi-VN').format(Math.round(Number(value) || 0)) + 'đ';
    }

    function formatDate(value) {
      const d = value?.toDate ? value.toDate() : new Date(value || 0);
      return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString('vi-VN');
    }

    function statusBadge(status) {
      const map = {
        'Completed': 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300',
        'In progress': 'bg-blue-100 text-blue-700 dark:bg-blue-500/15 dark:text-blue-300',
        'Pending': 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300',
        'Partial': 'bg-orange-100 text-orange-700 dark:bg-orange-500/15 dark:text-orange-300',
        'Canceled': 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300',
        'Rejected': 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300'
      };
      return `<span class="rounded-full px-2.5 py-1 text-xs font-semibold ${map[status] || 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'}">${escapeHtml(status)}</span>`;
    }

    function toast(message, type = 'info') {
      const root = document.getElementById('toast-root');
      const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
      const card = document.createElement('div');
      card.className = 'toast-in rounded-2xl border border-slate-200 bg-white/95 p-4 shadow-2xl dark:border-slate-800 dark:bg-slate-900/95';
      card.innerHTML = `<div class="flex items-start gap-3"><i class="fa-solid ${icon} mt-0.5"></i><div class="min-w-0 flex-1 text-sm font-medium">${escapeHtml(message)}</div><button class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>`;
      card.querySelector('button').addEventListener('click', () => card.remove());
      root.appendChild(card);
      setTimeout(() => card.remove(), 4200);
    }

    function ripple(e) {
      const button = e.currentTarget;
      const rect = button.getBoundingClientRect();
      const wave = document.createElement('span');
      wave.className = 'ripple-wave';
      const size = Math.max(rect.width, rect.height);
      wave.style.width = `${size}px`;
      wave.style.height = `${size}px`;
      wave.style.left = `${e.clientX - rect.left - size / 2}px`;
      wave.style.top = `${e.clientY - rect.top - size / 2}px`;
      button.appendChild(wave);
      wave.addEventListener('animationend', () => wave.remove());
    }

    function authButton(label, icon, type = 'submit') {
      return `<button type="${type}" class="ripple scale-active w-full rounded-2xl bg-slate-900 px-4 py-3 font-semibold text-white shadow-lg transition hover:-translate-y-0.5 hover:bg-slate-800 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200"><i class="fa-solid ${icon} mr-2"></i>${label}</button>`;
    }

    function renderLanding() {
      document.getElementById('app').innerHTML = `
        <div class="relative overflow-hidden">
          <div class="absolute inset-x-0 top-0 -z-10 h-[560px] bg-[radial-gradient(circle_at_top_left,rgba(59,130,246,.2),transparent_40%),radial-gradient(circle_at_top_right,rgba(16,185,129,.16),transparent_40%)]"></div>

            <a href="#" class="flex items-center gap-3 font-extrabold tracking-tight">
              <img src="/logo.png" alt="TDMS1VN" class="h-10 w-10 rounded-2xl object-contain shadow-sm" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')" />
              <div class="hidden h-10 w-10 place-items-center rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900"><i class="fa-solid fa-bolt"></i></div>
              <span class="text-xl">TDMS1VN</span>
            </a>
            <div class="flex items-center gap-2">
              <button id="landing-theme" class="ripple scale-active rounded-xl border border-slate-200 bg-white/70 px-3 py-2 text-sm dark:border-slate-800 dark:bg-slate-900/60"><i class="fa-solid fa-moon"></i></button>
              <button id="landing-login" class="ripple scale-active rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white dark:bg-white dark:text-slate-900">Đăng nhập</button>
            </div>
          </nav>
          <main class="mx-auto max-w-7xl px-5 pb-20 pt-10 lg:px-8 lg:pt-20">
            <section class="grid items-center gap-12 lg:grid-cols-[1.1fr_.9fr]">

                <div class="mb-5 inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/70 px-3 py-2 text-xs font-semibold dark:border-slate-800 dark:bg-slate-900/60"><span class="h-2 w-2 rounded-full bg-emerald-500"></span> Hệ thống tự động 24/7</div>
                <h1 class="max-w-3xl text-5xl font-extrabold tracking-tight sm:text-6xl">Quản lý dịch vụ số nhanh, rõ ràng và tự động.</h1>
                <p class="mt-6 max-w-2xl text-lg leading-8 text-slate-600 dark:text-slate-300">Đặt đơn, theo dõi trạng thái, nạp tiền và nhận hoàn tiền tự động khi nhà cung cấp hủy hoặc trả một phần đơn.</p>
                <div class="mt-8 flex flex-wrap gap-3"><button id="hero-start" class="ripple scale-active rounded-2xl bg-slate-900 px-5 py-3 font-semibold text-white shadow-lg dark:bg-white dark:text-slate-900">Bắt đầu ngay <i class="fa-solid fa-arrow-right ml-2"></i></button><button id="hero-info" class="ripple scale-active rounded-2xl border border-slate-300 px-5 py-3 font-semibold dark:border-slate-700">Xem tính năng</button></div>
                <div class="mt-10 grid max-w-2xl grid-cols-3 gap-3"><div class="rounded-2xl border border-slate-200 bg-white/70 p-4 dark:border-slate-800 dark:bg-slate-900/60"><div class="text-2xl font-extrabold">24/7</div><div class="mt-1 text-xs text-slate-500">Tự động đồng bộ</div></div><div class="rounded-2xl border border-slate-200 bg-white/70 p-4 dark:border-slate-800 dark:bg-slate-900/60"><div class="text-2xl font-extrabold">Realtime</div><div class="mt-1 text-xs text-slate-500">Số dư tài khoản</div></div><div class="rounded-2xl border border-slate-200 bg-white/70 p-4 dark:border-slate-800 dark:bg-slate-900/60"><div class="text-2xl font-extrabold">Auto</div><div class="mt-1 text-xs text-slate-500">Hoàn tiền</div></div></div>
              </div>
              <div class="glass rounded-[2rem] border border-slate-200 bg-white/70 p-5 shadow-glow dark:border-slate-800 dark:bg-slate-900/55">
                <div class="rounded-[1.5rem] bg-slate-950 p-5 text-white">
                  <div class="flex items-center justify-between"><div><div class="text-xs text-slate-400">Bảng điều khiển</div><div class="mt-1 text-xl font-bold">Tổng quan tài khoản</div></div><div class="rounded-xl bg-white/10 px-3 py-2"><i class="fa-solid fa-chart-line"></i></div></div>
                  <div class="mt-5 rounded-2xl bg-white/5 p-4"><div class="text-xs text-slate-400">Số dư hiện tại</div><div class="mt-2 text-3xl font-extrabold">1.250.000đ</div><div class="mt-4 h-2 overflow-hidden rounded-full bg-white/10"><div class="h-full w-2/3 rounded-full bg-white"></div></div></div>
                  <div class="mt-4 grid grid-cols-2 gap-3"><div class="rounded-2xl bg-white/5 p-4"><div class="text-xs text-slate-400">Đơn đang chạy</div><div class="mt-1 font-bold">12</div></div><div class="rounded-2xl bg-white/5 p-4"><div class="text-xs text-slate-400">Hoàn tiền</div><div class="mt-1 font-bold">48.000đ</div></div></div>
                </div>
              </div>
            </section>

            <section id="features" class="mt-28 grid gap-5 md:grid-cols-3">
              ${[
                ['fa-bolt', 'Đặt đơn tức thì', 'Chọn dịch vụ, nhập link và số lượng, hệ thống tự tính chi phí trước khi gửi.'],
                ['fa-arrows-rotate', 'Đồng bộ tự động', 'Backend kiểm tra trạng thái provider theo lịch và cập nhật đơn về Firestore.'],
                ['fa-shield-halved', 'Hoàn tiền an toàn', 'Giao dịch số dư dùng Firestore transaction để tránh cộng/trừ tiền trùng lặp.']
              ].map(([icon,title,text]) => `<article class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="mb-5 grid h-12 w-12 place-items-center rounded-2xl bg-slate-100 dark:bg-slate-800"><i class="fa-solid ${icon}"></i></div><h3 class="text-lg font-bold">${title}</h3><p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">${text}</p></article>`).join('')}

      document.querySelectorAll('.ripple').forEach(b => b.addEventListener('click', ripple));
      document.getElementById('landing-login').onclick = () => { state.authView = 'login'; renderAuth(); };
      document.getElementById('hero-start').onclick = () => { state.authView = 'register'; renderAuth(); };
      document.getElementById('hero-info').onclick = () => document.getElementById('features').scrollIntoView({ behavior: 'smooth' });
      document.getElementById('landing-theme').onclick = toggleTheme;
    }

    function renderAuth() {
      const isLogin = state.authView === 'login';
      document.getElementById('app').innerHTML = `
        <main class="min-h-screen bg-[radial-gradient(circle_at_top_left,rgba(59,130,246,.18),transparent_45%)] px-5 py-8">
          <div class="mx-auto grid min-h-[90vh] max-w-6xl items-center gap-10 lg:grid-cols-2">
            <section class="hidden lg:block"><div class="mb-6 inline-flex items-center gap-3"><img src="/logo.png" alt="TDMS1VN" class="h-12 w-12 rounded-2xl object-contain" /><span class="text-2xl font-extrabold">TDMS1VN</span></div><h1 class="text-5xl font-extrabold tracking-tight">Quản lý dịch vụ số trong một nơi.</h1><p class="mt-5 max-w-xl text-lg leading-8 text-slate-600 dark:text-slate-300">Đăng nhập để tạo đơn, xem số dư realtime và quản lý lịch sử giao dịch.</p></section>
            <section class="mx-auto w-full max-w-md rounded-[2rem] border border-slate-200 bg-white/90 p-7 shadow-glow dark:border-slate-800 dark:bg-slate-900/90">
              <div class="mb-8 flex items-center justify-between"><div><div class="text-2xl font-extrabold">${isLogin ? 'Chào mừng trở lại' : 'Tạo tài khoản'}</div><div class="mt-1 text-sm text-slate-500">${isLogin ? 'Đăng nhập để tiếp tục' : 'Tạo tài khoản mới trong vài giây'}</div></div><button id="auth-theme" class="ripple scale-active rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-800"><i class="fa-solid fa-moon"></i></button></div>
              ${!isLogin ? `<label class="mb-4 block"><span class="mb-2 block text-sm font-semibold">Họ tên</span><input id="auth-name" class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none focus:border-slate-500 dark:border-slate-700" placeholder="Nguyễn Văn A" /></label>` : ''}
              <form id="auth-form" class="space-y-4">
                <label class="block"><span class="mb-2 block text-sm font-semibold">Email</span><input id="auth-email" type="email" required class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none focus:border-slate-500 dark:border-slate-700" placeholder="you@example.com" /></label>
                <label class="block"><span class="mb-2 block text-sm font-semibold">Mật khẩu</span><input id="auth-password" type="password" minlength="6" required class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none focus:border-slate-500 dark:border-slate-700" placeholder="••••••••" /></label>
                ${authButton(isLogin ? 'Đăng nhập' : 'Đăng ký', isLogin ? 'fa-right-to-bracket' : 'fa-user-plus')}
              </form>
              <div class="my-5 flex items-center gap-3 text-xs text-slate-400"><span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span>HOẶC<span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span></div>
              <button id="google-btn" class="ripple scale-active w-full rounded-2xl border border-slate-200 px-4 py-3 font-semibold dark:border-slate-700"><i class="fa-brands fa-google mr-2"></i>Tiếp tục với Google</button>
              <button id="auth-switch" class="mt-5 w-full text-center text-sm font-semibold text-slate-500 hover:text-slate-900 dark:hover:text-white">${isLogin ? 'Chưa có tài khoản? Đăng ký' : 'Đã có tài khoản? Đăng nhập'}</button>
              <button id="auth-home" class="mt-3 w-full text-center text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">← Về trang chủ</button>
            </section>
          </div>
        </main>`;
      document.querySelectorAll('.ripple').forEach(b => b.addEventListener('click', ripple));
      document.getElementById('auth-form').addEventListener('submit', handleAuthSubmit);
      document.getElementById('google-btn').onclick = handleGoogle;
      document.getElementById('auth-switch').onclick = () => { state.authView = isLogin ? 'register' : 'login'; renderAuth(); };
      document.getElementById('auth-home').onclick = renderLanding;
      document.getElementById('auth-theme').onclick = toggleTheme;
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      try {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if (state.authView === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          const name = document.getElementById('auth-name').value.trim();
          if (name) await updateProfile(cred.user, { displayName: name });
        }
      } catch (error) {
        toast(friendlyFirebaseError(error), 'error');
      }
    }

    async function handleGoogle() {
      try { await signInWithPopup(auth, googleProvider); } catch (error) { toast(friendlyFirebaseError(error), 'error'); }
    }

    function friendlyFirebaseError(error) {
      const code = error?.code || '';
      const map = {
        'auth/invalid-credential': 'Email hoặc mật khẩu không đúng.',
        'auth/user-not-found': 'Không tìm thấy tài khoản.',
        'auth/wrong-password': 'Mật khẩu không đúng.',
        'auth/email-already-in-use': 'Email đã được sử dụng.',
        'auth/weak-password': 'Mật khẩu quá yếu.',
        'auth/popup-closed-by-user': 'Cửa sổ Google đã đóng.',
        'auth/operation-not-allowed': 'Phương thức đăng nhập này chưa được bật trên Firebase.'
      };
      return map[code] || error?.message || 'Đã xảy ra lỗi.';
    }

    async function apiFetch(path, options = {}) {
      if (!auth.currentUser) throw new Error('Bạn chưa đăng nhập.');
      const token = await auth.currentUser.getIdToken();
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', `Bearer ${token}`);
      if (options.body && !(options.body instanceof FormData)) headers.set('Content-Type', 'application/json');
      const response = await fetch(path, { ...options, headers });
      const text = await response.text();
      let data = null;
      try { data = JSON.parse(text); } catch { data = { error: text }; }
      if (!response.ok) throw new Error(data?.error || `HTTP ${response.status}`);
      return data;
    }

    async function ensureProfile() {
      await apiFetch('/api/me');
    }

    async function loadDashboardData() {
      state.loading = true;
      renderDashboard();
      try {
        await ensureProfile();
        const [services, orders, deposits, logs] = await Promise.all([
          apiFetch('/api/services'), apiFetch('/api/orders'), apiFetch('/api/deposits'), apiFetch('/api/balance-logs')
        ]);
        state.services = services.services || [];
        state.orders = orders.orders || [];
        state.deposits = deposits.deposits || [];
        state.logs = logs.logs || [];
      } catch (error) {
        toast(error.message, 'error');
      } finally {
        state.loading = false;
        renderDashboard();
      }
    }

    function subscribeProfile() {
      if (state.unsubscribeProfile) state.unsubscribeProfile();
      if (!state.user) return;
      state.unsubscribeProfile = onSnapshot(doc(firestore, 'users', state.user.uid), snap => {
        if (snap.exists()) {
          state.profile = { uid: snap.id, ...snap.data() };
          const balanceEl = document.getElementById('live-balance');
          if (balanceEl) balanceEl.textContent = formatMoney(state.profile.balance);
        }
      }, () => {});
    }

    function navButton(tab, icon, label) {
      const active = state.activeTab === tab;
      return `<button data-tab="${tab}" class="ripple scale-active flex items-center gap-3 rounded-2xl px-4 py-3 text-left text-sm font-semibold transition ${active ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'text-slate-500 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800'}"><i class="fa-solid ${icon} w-5 text-center"></i>${label}</button>`;
    }

    function renderDashboard() {
      const user = state.user;
      const displayName = state.profile?.displayName || user?.displayName || user?.email?.split('@')[0] || 'Bạn';
      const content = state.loading ? dashboardSkeleton() : dashboardTabContent();
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen">
          <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 hidden w-72 border-r border-slate-200 bg-white/95 p-5 backdrop-blur-xl dark:border-slate-800 dark:bg-slate-950/95 lg:block">
            <div class="flex items-center justify-between px-2"><div class="flex items-center gap-3"><img src="/logo.png" alt="TDMS1VN" class="h-10 w-10 rounded-2xl object-contain" /><div class="font-extrabold">TDMS1VN</div></div><button id="side-theme" class="ripple rounded-xl border border-slate-200 px-3 py-2 text-xs dark:border-slate-800"><i class="fa-solid fa-moon"></i></button></div>
            <div class="mt-8 space-y-2">${navButton('order','fa-cart-plus','Đặt đơn')}${navButton('orders','fa-list-check','Đơn hàng')}${navButton('deposit','fa-wallet','Nạp tiền')}${navButton('logs','fa-receipt','Sổ số dư')}</div>
            <div class="absolute bottom-5 left-5 right-5 rounded-3xl border border-slate-200 p-4 dark:border-slate-800"><div class="text-xs text-slate-500">Tài khoản</div><div class="mt-1 truncate font-semibold">${escapeHtml(user?.email || '')}</div><button id="logout" class="ripple scale-active mt-4 w-full rounded-2xl border border-slate-200 px-3 py-2 text-sm font-semibold dark:border-slate-700">Đăng xuất</button></div>
          </aside>
          <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/85 backdrop-blur-xl dark:border-slate-800 dark:bg-slate-950/85 lg:ml-72">
            <div class="flex items-center justify-between px-4 py-3 sm:px-6"><div class="flex items-center gap-3"><button id="hamburger" class="ripple rounded-xl border border-slate-200 px-3 py-2 lg:hidden dark:border-slate-800"><i class="fa-solid fa-bars"></i></button><div class="lg:hidden"><img src="/logo.png" alt="TDMS1VN" class="h-9 w-9 rounded-xl object-contain" /></div><div><div class="text-sm font-semibold">Xin chào, ${escapeHtml(displayName)}</div><div class="text-xs text-slate-500">Tài khoản ${state.profile?.role === 'admin' ? 'quản trị' : 'khách hàng'}</div></div></div><div class="flex items-center gap-2"><div class="rounded-2xl border border-slate-200 px-4 py-2 text-right dark:border-slate-800"><div class="text-[10px] uppercase tracking-wider text-slate-500">Số dư</div><div id="live-balance" class="font-extrabold">${formatMoney(state.profile?.balance || 0)}</div></div><button id="mobile-theme" class="ripple scale-active rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-800"><i class="fa-solid fa-moon"></i></button></div></div>
          </header>
          <main class="lg:ml-72"><div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">${content}</div></main>
          <div id="mobile-drawer" class="fixed inset-0 z-[60] hidden bg-slate-950/40 lg:hidden"><div class="h-full w-[85%] max-w-sm bg-white p-5 dark:bg-slate-950"><div class="flex items-center justify-between"><div class="flex items-center gap-3"><img src="/logo.png" alt="TDMS1VN" class="h-10 w-10 rounded-xl object-contain" /><span class="font-extrabold">TDMS1VN</span></div><button id="close-drawer" class="ripple rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-800"><i class="fa-solid fa-xmark"></i></button></div><div class="mt-8 space-y-2">${navButton('order','fa-cart-plus','Đặt đơn')}${navButton('orders','fa-list-check','Đơn hàng')}${navButton('deposit','fa-wallet','Nạp tiền')}${navButton('logs','fa-receipt','Sổ số dư')}</div><button id="drawer-logout" class="ripple scale-active mt-8 w-full rounded-2xl border border-slate-200 px-3 py-3 text-sm font-semibold dark:border-slate-800">Đăng xuất</button></div></div>
        </div>`;

      bindDashboardEvents();
    }

    function dashboardSkeleton() {
      return `<div class="space-y-6"><div class="grid gap-4 md:grid-cols-3"><div class="shimmer h-28 rounded-3xl"></div><div class="shimmer h-28 rounded-3xl"></div><div class="shimmer h-28 rounded-3xl"></div></div><div class="shimmer h-96 rounded-[2rem]"></div></div>`;
    }

    function dashboardTabContent() {
      if (state.activeTab === 'order') return orderTab();
      if (state.activeTab === 'orders') return ordersTab();
      if (state.activeTab === 'deposit') return depositTab();
      return logsTab();
    }

    function serviceOptions() {
      const groups = new Map();
      for (const service of state.services) {
        if (!groups.has(service.category)) groups.set(service.category, []);
        groups.get(service.category).push(service);
      }
      return [...groups.entries()].map(([category, services]) => `<optgroup label="${escapeHtml(category)}">${services.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)} — ${formatMoney(s.rate)}/1k</option>`).join('')}</optgroup>`).join('');
    }

    function orderTab() {
      const selected = state.services.find(s => s.id === state.orderForm.service);
      const quantity = Number(state.orderForm.quantity || 0);
      const total = selected ? Math.round(quantity * selected.rate / 1000) : 0;
      state.orderForm.totalPrice = total;
      return `
        <div class="mb-7"><div class="text-sm font-semibold text-slate-500">Khu vực đặt đơn</div><h1 class="mt-1 text-3xl font-extrabold tracking-tight">Tạo đơn mới</h1></div>
        <div class="grid gap-5 xl:grid-cols-[1.3fr_.7fr]">
          <form id="order-form" class="space-y-5">
            <section class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="mb-5 flex items-center gap-3"><div class="grid h-9 w-9 place-items-center rounded-xl bg-slate-900 text-sm font-bold text-white dark:bg-white dark:text-slate-900">1</div><div><h2 class="font-bold">Chọn dịch vụ</h2><p class="text-xs text-slate-500">Dịch vụ được lấy trực tiếp từ provider.</p></div></div><label class="block"><span class="mb-2 block text-sm font-semibold">Dịch vụ</span><select id="service-select" required class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none dark:border-slate-700"><option value="">${state.services.length ? 'Chọn dịch vụ' : 'Đang tải dịch vụ…'}</option>${serviceOptions()}</select></label>${selected ? `<div class="mt-4 grid gap-3 sm:grid-cols-3"><div class="rounded-2xl bg-slate-100 p-3 dark:bg-slate-800"><div class="text-xs text-slate-500">Giá</div><div class="mt-1 font-bold">${formatMoney(selected.rate)}/1k</div></div><div class="rounded-2xl bg-slate-100 p-3 dark:bg-slate-800"><div class="text-xs text-slate-500">Tối thiểu</div><div class="mt-1 font-bold">${selected.min.toLocaleString('vi-VN')}</div></div><div class="rounded-2xl bg-slate-100 p-3 dark:bg-slate-800"><div class="text-xs text-slate-500">Tối đa</div><div class="mt-1 font-bold">${selected.max.toLocaleString('vi-VN')}</div></div></div>` : ''}</section>
            <section class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="mb-5 flex items-center gap-3"><div class="grid h-9 w-9 place-items-center rounded-xl bg-slate-900 text-sm font-bold text-white dark:bg-white dark:text-slate-900">2</div><div><h2 class="font-bold">Thông tin đơn</h2><p class="text-xs text-slate-500">Nhập đúng link và số lượng cần chạy.</p></div></div><div class="space-y-4"><label class="block"><span class="mb-2 block text-sm font-semibold">Link</span><input id="order-link" value="${escapeHtml(state.orderForm.link)}" type="url" required placeholder="https://..." class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none dark:border-slate-700" /></label><label class="block"><span class="mb-2 block text-sm font-semibold">Số lượng</span><input id="order-quantity" value="${quantity || ''}" type="number" min="1" step="1" required placeholder="1000" class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none dark:border-slate-700" /></label></div></section>
            <section class="dashed-note rounded-[2rem] p-5"><div class="flex items-start gap-3"><i class="fa-solid fa-circle-info mt-1 text-slate-500"></i><div><h3 class="font-bold">Lưu ý</h3><p class="mt-1 text-sm leading-6 text-slate-500">Đơn được trừ tiền trước, gửi sang provider sau đó. Nếu provider hủy hoặc trả một phần, hệ thống sẽ hoàn tiền phần chưa chạy bằng transaction.</p></div></div></section>
            <button id="submit-order" class="ripple scale-active w-full rounded-2xl bg-slate-900 px-5 py-4 font-bold text-white shadow-lg transition hover:-translate-y-0.5 dark:bg-white dark:text-slate-900"><i class="fa-solid fa-paper-plane mr-2"></i>Gửi đơn</button>
          </form>
          <aside class="h-fit rounded-[2rem] border border-slate-200 bg-slate-950 p-6 text-white shadow-xl dark:border-slate-800"><div class="text-xs uppercase tracking-[.2em] text-slate-400">Tóm tắt</div><div class="mt-4 text-2xl font-extrabold">${selected ? escapeHtml(selected.name) : 'Chưa chọn dịch vụ'}</div><div class="mt-7 space-y-4"><div class="flex items-center justify-between text-sm"><span class="text-slate-400">Số lượng</span><span class="font-semibold">${quantity ? quantity.toLocaleString('vi-VN') : '—'}</span></div><div class="flex items-center justify-between text-sm"><span class="text-slate-400">Đơn giá</span><span class="font-semibold">${selected ? formatMoney(selected.rate) + ' / 1k' : '—'}</span></div><div class="h-px bg-white/10"></div><div class="flex items-end justify-between"><span class="text-slate-400">Tổng tiền</span><span class="text-3xl font-extrabold">${formatMoney(total)}</span></div></div></aside>
        </div>`;
    }

    function ordersTab() {
      return `<div><div class="mb-7"><div class="text-sm font-semibold text-slate-500">Lịch sử</div><h1 class="mt-1 text-3xl font-extrabold">Đơn hàng</h1></div><div class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="overflow-x-auto"><table class="min-w-full text-left text-sm"><thead class="border-b border-slate-200 bg-slate-50 text-xs uppercase tracking-wider text-slate-500 dark:border-slate-800 dark:bg-slate-950"><tr><th class="px-5 py-4">Mã</th><th class="px-5 py-4">Dịch vụ</th><th class="px-5 py-4">SL</th><th class="px-5 py-4">Giá</th><th class="px-5 py-4">Trạng thái</th><th class="px-5 py-4">Ngày</th></tr></thead><tbody>${state.orders.length ? state.orders.map(o => `<tr class="border-b border-slate-100 last:border-0 dark:border-slate-800"><td class="px-5 py-4 font-mono text-xs">${escapeHtml(o.id.slice(0,8))}</td><td class="max-w-xs px-5 py-4"><div class="font-semibold">${escapeHtml(o.serviceName)}</div><div class="mt-1 truncate text-xs text-slate-500">${escapeHtml(o.link)}</div></td><td class="px-5 py-4">${Number(o.quantity || 0).toLocaleString('vi-VN')}</td><td class="px-5 py-4 font-semibold">${formatMoney(o.totalPrice)}</td><td class="px-5 py-4">${statusBadge(o.status)}</td><td class="px-5 py-4 text-xs text-slate-500">${formatDate(o.createdAtIso)}</td></tr>`).join('') : `<tr><td colspan="6" class="px-5 py-12 text-center text-slate-500">Chưa có đơn hàng.</td></tr>`}</tbody></table></div></div></div>`;
    }

    function depositTab() {
      return `<div class="grid gap-5 xl:grid-cols-[.8fr_1.2fr]"><section><div class="mb-7"><div class="text-sm font-semibold text-slate-500">Tài chính</div><h1 class="mt-1 text-3xl font-extrabold">Nạp tiền</h1></div><form id="deposit-form" class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"><label class="block"><span class="mb-2 block text-sm font-semibold">Số tiền (VND)</span><input id="deposit-amount" type="number" min="1000" step="1000" required class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none dark:border-slate-700" placeholder="100000" /></label><label class="mt-4 block"><span class="mb-2 block text-sm font-semibold">Phương thức</span><select id="deposit-method" class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none dark:border-slate-700"><option>Bank transfer</option><option>QR / VietQR</option><option>Khác</option></select></label><label class="mt-4 block"><span class="mb-2 block text-sm font-semibold">Ghi chú</span><textarea id="deposit-note" rows="4" class="w-full rounded-2xl border border-slate-200 bg-transparent px-4 py-3 outline-none dark:border-slate-700" placeholder="Mã giao dịch ngân hàng…"></textarea></label><button id="submit-deposit" class="ripple scale-active mt-5 w-full rounded-2xl bg-slate-900 px-4 py-3 font-bold text-white dark:bg-white dark:text-slate-900"><i class="fa-solid fa-paper-plane mr-2"></i>Gửi yêu cầu</button></form></section><section><div class="mb-7"><div class="text-sm font-semibold text-slate-500">Theo dõi</div><h2 class="mt-1 text-3xl font-extrabold">Yêu cầu gần đây</h2></div><div class="space-y-3">${state.deposits.length ? state.deposits.map(d => `<div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="flex items-start justify-between gap-4"><div><div class="font-bold">${formatMoney(d.amount)}</div><div class="mt-1 text-xs text-slate-500">${escapeHtml(d.method)} · ${formatDate(d.createdAtIso)}</div></div>${statusBadge(d.status)}</div>${d.note ? `<div class="mt-3 rounded-2xl bg-slate-50 p-3 text-sm text-slate-600 dark:bg-slate-950 dark:text-slate-300">${escapeHtml(d.note)}</div>` : ''}</div>`).join('') : `<div class="rounded-3xl border border-dashed border-slate-300 p-10 text-center text-slate-500 dark:border-slate-700">Chưa có yêu cầu nạp tiền.</div>`}</div></section></div>`;
    }

    function logsTab() {
      return `<div><div class="mb-7"><div class="text-sm font-semibold text-slate-500">Tài chính</div><h1 class="mt-1 text-3xl font-extrabold">Sổ số dư</h1></div><div class="space-y-3">${state.logs.length ? state.logs.map(log => { const positive = Number(log.amount) >= 0; return `<div class="flex items-center justify-between gap-4 rounded-3xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="min-w-0"><div class="font-semibold">${escapeHtml(log.reason)}</div><div class="mt-1 text-xs text-slate-500">${escapeHtml(log.type)} · ${formatDate(log.createdAtIso)}</div></div><div class="text-right"><div class="font-extrabold ${positive ? 'text-emerald-600 dark:text-emerald-300' : 'text-rose-600 dark:text-rose-300'}">${positive ? '+' : ''}${formatMoney(log.amount)}</div><div class="mt-1 text-xs text-slate-500">Sau giao dịch: ${formatMoney(log.balanceAfter)}</div></div></div>`; }).join('') : `<div class="rounded-3xl border border-dashed border-slate-300 p-10 text-center text-slate-500 dark:border-slate-700">Chưa có giao dịch số dư.</div>`}</div></div>`;
    }

    function bindDashboardEvents() {
      document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => { state.activeTab = btn.dataset.tab; closeDrawer(); renderDashboard(); }));
      const themeButtons = ['side-theme','mobile-theme'].map(id => document.getElementById(id)).filter(Boolean);
      themeButtons.forEach(btn => btn.addEventListener('click', toggleTheme));
      document.getElementById('logout')?.addEventListener('click', doLogout);
      document.getElementById('drawer-logout')?.addEventListener('click', doLogout);
      const hamburger = document.getElementById('hamburger');
      const drawer = document.getElementById('mobile-drawer');
      if (hamburger && drawer) hamburger.onclick = () => drawer.classList.remove('hidden');
      document.getElementById('close-drawer')?.addEventListener('click', closeDrawer);
      drawer?.addEventListener('click', e => { if (e.target === drawer) closeDrawer(); });

      document.querySelectorAll('.ripple').forEach(b => { if (!b.dataset.rippleBound) { b.addEventListener('click', ripple); b.dataset.rippleBound = '1'; } });
      if (state.activeTab === 'order') bindOrderEvents();
      if (state.activeTab === 'deposit') bindDepositEvents();
    }

    function closeDrawer() { document.getElementById('mobile-drawer')?.classList.add('hidden'); }

    function bindOrderEvents() {
      const serviceSelect = document.getElementById('service-select');
      const linkInput = document.getElementById('order-link');
      const qtyInput = document.getElementById('order-quantity');
      serviceSelect?.addEventListener('change', () => { state.orderForm.service = serviceSelect.value; renderDashboard(); });
      linkInput?.addEventListener('input', () => state.orderForm.link = linkInput.value);
      qtyInput?.addEventListener('input', () => { state.orderForm.quantity = Number(qtyInput.value || 0); updateOrderTotalOnly(); });
      document.getElementById('order-form')?.addEventListener('submit', submitOrder);
    }

    function updateOrderTotalOnly() {
      const selected = state.services.find(s => s.id === state.orderForm.service);
      const total = selected ? Math.round(Number(state.orderForm.quantity || 0) * selected.rate / 1000) : 0;
      const totalNode = document.querySelector('aside .text-3xl');
      if (totalNode) totalNode.textContent = formatMoney(total);
      const selectedName = document.querySelector('aside .text-2xl');
      if (selectedName && selected) selectedName.textContent = selected.name;
    }

    async function withCooldown(button, fn) {
      const now = Date.now();
      if (now < state.cooldownUntil) {
        toast(`Vui lòng đợi ${Math.ceil((state.cooldownUntil - now) / 1000)} giây.`, 'info');
        return;
      }
      state.cooldownUntil = now + 5000;
      if (button) button.disabled = true;
      try { await fn(); } finally {
        let remaining = 5;
        if (button) {
          const original = button.innerHTML;
          button.dataset.original = original;
          const interval = setInterval(() => {
            remaining -= 1;
            if (remaining <= 0) {
              clearInterval(interval);
              button.disabled = false;
              button.innerHTML = button.dataset.original || original;
            } else {
              button.innerHTML = `<i class="fa-solid fa-clock mr-2"></i>Chờ ${remaining}s`;
            }
          }, 1000);
        }
      }
    }

    async function submitOrder(e) {
      e.preventDefault();
      const button = document.getElementById('submit-order');
      await withCooldown(button, async () => {
        try {
          const selected = state.services.find(s => s.id === state.orderForm.service);
          const quantity = Number(document.getElementById('order-quantity').value || 0);
          const link = document.getElementById('order-link').value.trim();
          if (!selected) throw new Error('Hãy chọn dịch vụ.');
          if (quantity < selected.min || quantity > selected.max) throw new Error(`Số lượng phải từ ${selected.min.toLocaleString('vi-VN')} đến ${selected.max.toLocaleString('vi-VN')}.`);
          if (!/^https?:\/\//i.test(link)) throw new Error('Link phải bắt đầu bằng http:// hoặc https://.');
          const totalPrice = Math.round(quantity * selected.rate / 1000);
          const data = await apiFetch('/api/orders', { method: 'POST', body: JSON.stringify({ service: selected.id, link, quantity, totalPrice }) });
          toast(`Tạo đơn thành công: ${data.order.id.slice(0, 8)}…`, 'success');
          state.orderForm = { service: selected.id, link: '', quantity: 0, totalPrice: 0 };
          await loadDashboardData();
        } catch (error) { toast(error.message, 'error'); }
      });
    }

    function bindDepositEvents() {
      document.getElementById('deposit-form')?.addEventListener('submit', submitDeposit);
    }

    async function submitDeposit(e) {
      e.preventDefault();
      const button = document.getElementById('submit-deposit');
      await withCooldown(button, async () => {
        try {
          const amount = Number(document.getElementById('deposit-amount').value || 0);
          const method = document.getElementById('deposit-method').value;
          const note = document.getElementById('deposit-note').value.trim();
          if (amount < 1000) throw new Error('Số tiền tối thiểu là 1.000đ.');
          await apiFetch('/api/deposits', { method: 'POST', body: JSON.stringify({ amount, method, note }) });
          toast('Đã gửi yêu cầu nạp tiền. Admin sẽ xử lý qua Telegram.', 'success');
          await loadDashboardData();
        } catch (error) { toast(error.message, 'error'); }
      });
    }

    async function doLogout() {
      try { await signOut(auth); } catch (error) { toast(error.message, 'error'); }
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('tdms-theme', state.theme);
      document.documentElement.classList.toggle('dark', state.theme === 'dark');
      if (state.user) renderDashboard(); else if (state.authView) renderAuth(); else renderLanding();
    }

    onAuthStateChanged(auth, async user => {
      state.user = user;
      if (state.unsubscribeProfile) { state.unsubscribeProfile(); state.unsubscribeProfile = null; }
      if (!user) {
        state.profile = null;
        renderLanding();
        return;
      }
      state.activeTab = 'order';
      renderDashboard();
      subscribeProfile();
      await loadDashboardData();
    });

    renderLanding();
  </script>
</body>
</html>
